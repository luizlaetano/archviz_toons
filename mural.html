<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mural · Controle Novo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="mural.css?v=4" />
</head>
<body>

<header id="topbar">
  <h1 id="mural-title">Mural</h1>
  <span id="badge-view" class="badge" hidden>somente visualização</span>
  <div class="spacer"></div>
  <span id="status" role="status"></span>
  <button id="btn-fit" class="btn-ghost">enquadrar</button>
  <button id="btn-copy" class="btn-ghost">copiar link</button>
</header>

<nav id="toolbar" hidden>
  <button data-tool="select" class="tool active" data-label="Selecionar (V)" aria-label="Selecionar: clique para ligar/desligar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
  <div class="tool-wrap">
    <button data-tool="pen" class="tool" data-label="Caneta (P)" aria-label="Caneta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
    <div id="pen-panel" hidden>
      <input type="color" id="pen-color" value="#C79A3E" title="Cor" />
      <input type="hidden" id="pen-width" value="6" />
      <button class="w" data-w="3" aria-label="Fina"><i style="--d:3px"></i></button>
      <button class="w active" data-w="6" aria-label="Média"><i style="--d:6px"></i></button>
      <button class="w" data-w="12" aria-label="Grossa"><i style="--d:12px"></i></button>
    </div>
  </div>
  <button data-tool="text" class="tool" data-label="Texto (T)" aria-label="Texto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
  <button data-tool="eraser" class="tool" data-label="Borracha: apaga traços (E)" aria-label="Borracha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-6 6H8z"/><path d="M9 20h11M8 10l6 6"/></svg></button>
  <button id="btn-image" data-label="Inserir imagem (I)" aria-label="Inserir imagem"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></button>
  <hr />
  <button id="btn-undo" data-label="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button id="btn-redo" data-label="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <hr />
  <button id="btn-delete" class="danger" data-label="Excluir selecionado (Del)" aria-label="Excluir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</nav>

<div id="stage-wrap">
  <div id="stage"></div>
  <textarea id="editor" hidden></textarea>
</div>

<div id="fail" hidden></div>
<input type="file" id="file-input" accept="image/*" multiple hidden />

<script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
<script type="module" src="mural.js?v=4"></script>
</body>
</html>
